<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anjali AI Call - Jabalpur Life RP</title>
<style>
body{background:#0f0f0f;color:white;font-family:system-ui;text-align:center;padding:20px}
.card{background:#1e1e1e;padding:25px;border-radius:20px;max-width:400px;margin:auto;box-shadow:0 0 20px #ff2a6d33}
button{width:100%;padding:18px;font-size:20px;background:#ff2a6d;color:white;border:none;border-radius:12px;margin-top:15px}
#log{margin-top:15px;background:#000;padding:10px;border-radius:10px;min-height:80px;text-align:left;font-size:14px}
.ad{margin:15px 0;padding:10px;background:#222;border:1px dashed #555;font-size:12px}
</style>
</head>
<body>
<div class="card">
<h2>📞 Anjali AI se baat karo</h2>
<p style="font-size:12px;color:#aaa">Note: Ye ek AI voice assistant hai</p>

<div class="ad">
AD YAHAN AAYEGA<br>
Google AdSense code yahan paste karna
</div>

<button id="startBtn">🎤 CALL START KARO</button>
<button id="stopBtn" style="background:#444">🔴 CALL CUT KARO</button>

<div id="log">Status: Taiyaar hai... button dabao</div>

<div class="ad">
AD 2 YAHAN AAYEGA
</div>
</div>

<script>
const log = document.getElementById('log');
const startBtn = document.getElementById('startBtn');

let recognition;
let isCalling = false;

if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SR();
    recognition.lang = 'hi-IN';
    recognition.interimResults = false;
} else {
    log.innerHTML = "Aapka browser support nahi karta, Chrome me kholo";
}

function speak(text){
    speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'hi-IN';
    utter.rate = 0.95;
    utter.pitch = 1.2; // ladki jaisi awaz ke liye pitch high
    // Phone me jo female voice hai wo auto select hogi
    const voices = speechSynthesis.getVoices();
    const femaleVoice = voices.find(v => v.name.includes('Female') || v.name.includes('Heera') || v.lang === 'hi-IN');
    if(femaleVoice) utter.voice = femaleVoice;
    speechSynthesis.speak(utter);
    log.innerHTML += `<br><b>Anjali:</b> ${text}`;
}

startBtn.onclick = () => {
    if(!isCalling){
        isCalling = true;
        log.innerHTML = "Call connected... bolo hello";
        speak("Hello, mai Anjali bol rahi hu, bolo kya haal hai?");
        recognition.start();
        startBtn.innerText = "🎧 Sun rahi hu...";
    }
};

recognition.onresult = (e) => {
    const userText = e.results[0][0].transcript;
    log.innerHTML += `<br><b>Tum:</b> ${userText}`;

    let reply = "";
    const t = userText.toLowerCase();
    if(t.includes("hello") || t.includes("hi") || t.includes("namaste")){
        reply = "Namaste jaan, kaise ho? Bolo kya help karu?";
    } else if(t.includes("game")){
        reply = "Game Jabalpur Life RP GitHub pe live hai, tum waha se khel sakte ho.";
    } else if(t.includes("kaun ho") || t.includes("kya ho")){
        reply = "Mai Anjali hu, ek AI assistant, Jabalpur Life RP ki taraf se aapki help ke liye.";
    } else {
        reply = "Samajh gayi, " + userText + ". Aur batao kya chahiye?";
    }
    
    setTimeout(()=> speak(reply), 500);
};

recognition.onend = () => {
    if(isCalling) recognition.start(); // call cut nahi hua to sunte raho
};

document.getElementById('stopBtn').onclick = () => {
    isCalling = false;
    recognition.stop();
    speechSynthesis.cancel();
    log.innerHTML += "<br>Call cut ho gaya";
    startBtn.innerText = "🎤 CALL START KARO";
};

// Ad ke liye - yahan apna AdSense code paste kar dena
// <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"></script>
</script>
</body>
</html>
