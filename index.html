
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anjali AI Call - Fixed</title>
<style>
body{background:#0f0f0f;color:white;font-family:system-ui;text-align:center;padding:20px}
.card{background:#1e1e1e;padding:25px;border-radius:20px;max-width:400px;margin:auto;box-shadow:0 0 20px #ff2a6d33}
button{width:100%;padding:18px;font-size:20px;background:#ff2a6d;color:white;border:none;border-radius:12px;margin-top:15px}
#log{margin-top:15px;background:#000;padding:10px;border-radius:10px;min-height:80px;text-align:left;font-size:14px;max-height:200px;overflow-y:auto;}
</style>
</head>
<body>
<div class="card">
<h2>📞 Anjali AI se baat karo</h2>
<button id="startBtn">🎤 CALL START KARO</button>
<button id="stopBtn" style="background:#444">🔴 CALL CUT KARO</button>
<div id="log">Status: Taiyaar hai...</div>
</div>
<script>
const log = document.getElementById('log');
const startBtn = document.getElementById('startBtn');
let recognition; let isCalling = false;

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
recognition = new SR();
recognition.lang = 'hi-IN';
recognition.interimResults = false;

function speak(text){
    // FIX 1: Bolte time sunna band
    try{ recognition.stop(); }catch(e){}
    
    speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'hi-IN';
    utter.rate = 0.9;
    utter.pitch = 1.4; // jyada ladki jaisi
    
    // Best female voice dhoondo
    const voices = speechSynthesis.getVoices();
    let v = voices.find(x=>x.name.includes('Heera')) || voices.find(x=>x.name.includes('Google हिन्दी')) || voices.find(x=>x.lang==='hi-IN');
    if(v) utter.voice = v;

    log.innerHTML += `<br><b>Anjali:</b> ${text}`;
    log.scrollTop = log.scrollHeight;

    utter.onend = () => {
        // FIX 2: Bolne ke baad hi sunna start karo
        if(isCalling){
            try{ recognition.start(); }catch(e){}
            startBtn.innerText = "🎧 Sun rahi hu... bolo";
        }
    };
    speechSynthesis.speak(utter);
}

startBtn.onclick = () => {
    speechSynthesis.getVoices(); // voice load karne ke liye
    if(!isCalling){
        isCalling = true;
        log.innerHTML = "Call connected... bolo hello";
        setTimeout(()=> speak("Hello, mai Anjali bol rahi hu, bolo kya haal hai?"), 500);
        startBtn.innerText = "🎧 Sun rahi hu...";
    }
};

recognition.onresult = (e) => {
    const userText = e.results[0][0].transcript;
    if(userText.length < 2) return; // khali awaz ignore
    log.innerHTML += `<br><b>Tum:</b> ${userText}`;
    
    let reply = "";
    const t = userText.toLowerCase();
    if(t.includes("kaise ho") || t.includes("kya haal")){
        reply = "Mai ekdum mast hu jaan, tum batao kya chal raha hai?";
    } else if(t.includes("kaun ho")){
        reply = "Mai Anjali hu, Jabalpur Life RP ki AI assistant.";
    } else if(t.includes("game")){
        reply = "Game GitHub pe live hai, tum waha jaake khel sakte ho.";
    } else {
        reply = "Accha, " + userText + ", aur batao?";
    }
    setTimeout(()=> speak(reply), 700);
};

recognition.onend = () => {
    // Agar Anjali bol rahi hai to mic start mat karo (loop fix)
    if(isCalling && !speechSynthesis.speaking){
        try{ recognition.start(); }catch(e){}
    }
};

document.getElementById('stopBtn').onclick = () => {
    isCalling = false;
    try{ recognition.stop(); }catch(e){}
    speechSynthesis.cancel();
    log.innerHTML += "<br>Call cut ho gaya";
    startBtn.innerText = "🎤 CALL START KARO";
};
</script>
</body>
</html>
